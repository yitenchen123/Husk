name: Husk fixed IPA (ZL2 / FCL)

# Produces a ready-to-install IPA without a macOS runner and without building
# QEMU / ANGLE / MoltenVK. The display fix lives in the Java framework dex,
# which is recompiled here and swapped into the upstream 3.4 release bundle.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  ipa:
    name: Repack upstream IPA with fixed dex
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip curl python3
          for t in unzip zip curl python3 javac; do
            command -v "$t" >/dev/null || { echo "missing: $t" >&2; exit 1; }
          done
          java -version

      - name: Repackage
        run: |
          mkdir -p build
          set -o pipefail
          bash -x scripts/package_from_release.sh 2>&1 | tee build/repack.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: husk-repack-log
          path: build/repack.log
          if-no-files-found: warn

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Husk-fixed-IPA
          path: |
            build/Husk-fixed.ipa
            build/Husk-fixed-a11.tipa
          if-no-files-found: error

      - name: Post the repack diagnostics as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          p = 'build/repack.log'
          txt = open(p, errors='replace').read()[-30000:] if os.path.exists(p) else '(no log)'
          body = 'Repack diagnostics for ' + os.environ['SHA'][:8] + ':\n\n```\n' + txt + '\n```'
          url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/commits/' + os.environ['SHA'] + '/comments'
          q = urllib.request.Request(url, data=json.dumps({'body': body[:60000]}).encode(), method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json', 'User-Agent': 'husk-ci'})
          try:
              with urllib.request.urlopen(q, timeout=30) as r: print('comment', r.status)
          except urllib.error.HTTPError as e:
              print('comment failed', e.code, e.read().decode()[:300])
          PY

      # A Release gives the user a permanent, directly downloadable URL.
      - name: Publish a Release with the IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="display-fix-zl2-fcl"
          NOTES="ZL2 / FCL display fix, ready to install. Built from the upstream 3.4 Husk.ipa with Husk's Java framework recompiled from this checkout (commit ${{ github.sha }}). Only the dex files are replaced; the native runtime, ANGLE, QEMU dylib and guest images are upstream 3.4 binaries. Husk-fixed-a11.tipa is for TrollStore Lite on iPhone X (A11, iOS 16.7.15, Dopamine active); Husk-fixed.ipa is for SideStore / AltStore. Fixes: floating-window insets, wrap_content dialog size cap, window clamping into the screen, WebView login frame clamping, and a derived safe-area fallback when the host reports no insets at cold start. Untested on device: verify the login dialog and download progress bar with TL_VIEW_DUMP=1."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Husk-fixed.ipa build/Husk-fixed-a11.tipa --clobber
          else
            gh release create "$TAG" build/Husk-fixed.ipa build/Husk-fixed-a11.tipa \
              --title "Husk — ZL2 / FCL display fix" --notes "$NOTES"
          fi
          echo "RELEASE_URL=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_ENV"
          gh release view "$TAG" --json url,tagName,assets -q '"\(.url)\n\(.assets[].name) \(.assets[].size)"'
